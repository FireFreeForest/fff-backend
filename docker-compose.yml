name: fire-free-forest

x-app-env: &app-env
  APP_ENV: production
  HTTP_ADDR: ":8080"
  LOG_LEVEL: info
  DB_DSN: "host=postgres user=fff password=${POSTGRES_PASSWORD:-fff} dbname=fff port=5432 sslmode=disable TimeZone=UTC"
  REDIS_ADDR: "redis:6379"
  MQTT_BROKER: "tcp://mosquitto:1883"
  MQTT_USERNAME: backend
  MQTT_PASSWORD: "${MQTT_BACKEND_PASSWORD:-change-me-backend}"
  MQTT_QOS: "1"
  MQTT_TOPIC_PREFIX: "${MQTT_TOPIC_PREFIX:-fire-free-forest}"
  GEOCODE_BASE_URL: "${GEOCODE_BASE_URL:-https://nominatim.openstreetmap.org}"
  GEOCODE_USER_AGENT: "${GEOCODE_USER_AGENT:-FireFreeForest/1.0}"
  GEOCODE_CACHE_TTL: "${GEOCODE_CACHE_TTL:-720h}"
  THRESHOLD_SMOKE_LEVEL: "${THRESHOLD_SMOKE_LEVEL:-500}"
  THRESHOLD_SOIL_DRY_ADC: "${THRESHOLD_SOIL_DRY_ADC:-300}"
  AUTO_PUMP_ENABLED: "${AUTO_PUMP_ENABLED:-false}"
  JWT_SECRET: "${JWT_SECRET:-change-me-jwt-secret-please-use-32-chars-min}"
  SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@fff.local}"
  SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-admin12345}"
  SEED_ADMIN_NAME: "${SEED_ADMIN_NAME:-Administrator}"
  SEED_DEVICE_ID: "${SEED_DEVICE_ID:-FFF-VIRTUAL-DEVICE}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
  WS_ALLOWED_ORIGIN: "${WS_ALLOWED_ORIGIN:-*}"
  FCM_CREDENTIALS_FILE: "${FCM_CREDENTIALS_FILE:-}"
  FCM_PROJECT_ID: "${FCM_PROJECT_ID:-}"
  FCM_MIN_SEVERITY: "${FCM_MIN_SEVERITY:-error}"
  FCM_EVENT_TYPES: "${FCM_EVENT_TYPES:-FIRE_DETECTED,SMOKE_DETECTED,TEMPERATURE_HIGH,SOIL_DRY,DEVICE_OFFLINE,SENSOR_ERROR}"
  TELEMETRY_RETENTION_DAYS: "${TELEMETRY_RETENTION_DAYS:-90}"
  MCP_ENABLED: "${MCP_ENABLED:-false}"
  MCP_RATE_LIMIT_PER_MIN: "${MCP_RATE_LIMIT_PER_MIN:-120}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fff
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fff}"
      POSTGRES_DB: fff
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fff -d fff"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mosquitto-init:
    image: eclipse-mosquitto:2
    user: root
    restart: "no"
    environment:
      MQTT_BACKEND_PASSWORD: "${MQTT_BACKEND_PASSWORD:-change-me-backend}"
      MQTT_DEVICE_USERNAME: "${MQTT_DEVICE_USERNAME:?MQTT_DEVICE_USERNAME is required}"
      MQTT_DEVICE_PASSWORD: "${MQTT_DEVICE_PASSWORD:?MQTT_DEVICE_PASSWORD is required}"
      MQTT_TOPIC_PREFIX: "${MQTT_TOPIC_PREFIX:-fire-free-forest}"
    entrypoint: ["/bin/sh", "/mosquitto/init/init.sh"]
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./deploy/mosquitto/init.sh:/mosquitto/init/init.sh:ro

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "${MQTT_BIND_IP:-0.0.0.0}:1883:1883"
      - "${MQTT_WS_BIND_IP:-0.0.0.0}:9001:9001"
    environment:
      MQTT_BACKEND_PASSWORD: "${MQTT_BACKEND_PASSWORD:-change-me-backend}"
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u backend -P \"$${MQTT_BACKEND_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: fire-free-forest-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      - "${API_BIND_IP:-0.0.0.0}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: fire-free-forest-backend:local
    restart: unless-stopped
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      <<: *app-env
      MQTT_CLIENT_ID: fff-worker-1
    volumes:
      - ./deploy/fcm:/app/secrets:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      api:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: "${API_DOMAIN:-api.example.com}"
      MQTT_DOMAIN: "${MQTT_DOMAIN:-mqtt.example.com}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@example.com}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  redisdata:
  mosquitto-data:
  caddy-data:
  caddy-config:
