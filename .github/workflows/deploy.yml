name: Deploy Backend

on:
  push:
    branches:
      - main

concurrency:
  group: fff-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            export PATH="/usr/local/go/bin:/home/ubuntu/go/bin:/home/ubuntu/.bun/bin:/usr/local/bin:/usr/bin:/bin"
            export HOME="/home/ubuntu"

            cd /home/ubuntu/fff/fff-backend

            echo "=== Environment ==="
            go version
            pm2 --version

            echo "=== Pulling changes ==="
            git pull origin main

            mkdir -p bin

            echo "=== Building API ==="
            go build -trimpath -ldflags="-s -w" -o bin/api ./cmd/api

            echo "=== Building Worker ==="
            go build -trimpath -ldflags="-s -w" -o bin/worker ./cmd/worker

            echo "=== Restarting PM2 ==="
            pm2 restart ecosystem.config.cjs --update-env

            echo "=== Saving PM2 ==="
            pm2 save

            echo "=== Deployment completed! ==="
