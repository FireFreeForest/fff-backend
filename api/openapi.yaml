openapi: 3.0.3
info:
  title: Fire Free Forest API
  version: 1.0.0
  description: |
    REST API untuk sistem deteksi dini kebakaran hutan Fire Free Forest.

    Swagger UI tersedia di `/docs` dan spec mentah di `/docs/openapi.yaml`.
    Autentikasi memakai Bearer JWT dari `POST /auth/login`.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login, rotasi refresh token, profil, dan logout.
  - name: Users
    description: Manajemen user (khusus admin).
  - name: Devices
    description: Manajemen dan status perangkat.
  - name: Telemetry
    description: Riwayat dan data terbaru telemetri lingkungan serta api/asap.
  - name: Commands
    description: Pengiriman dan pemantauan command pompa.
  - name: Events
    description: Daftar, detail, acknowledge, dan resolve event risiko.
  - name: Dashboard
    description: Ringkasan agregat untuk dashboard.
  - name: Geocoding
    description: Reverse geocoding koordinat menjadi label lokasi.
  - name: Push
    description: Registrasi token Firebase Cloud Messaging.
  - name: Realtime
    description: |
      WebSocket tidak dideskripsikan sebagai path OpenAPI. Alurnya:
      1. `POST /realtime/ticket` dengan Bearer token.
      2. Koneksi ke `ws://<host>/api/v1/ws?ticket=<ticket>&device_id=<opsional>`.

      Pesan memakai envelope `{type, device_id, data, ts}` dengan tipe:
      `connected`, `telemetry.environment`, `telemetry.fire`, `event.created`,
      `event.resolved`, `risk.updated`, `device.status`, `command.issued`,
      `command.ack`, `command.timeout`.

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Token pair dan profil user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tokens: { $ref: "#/components/schemas/TokenPair" }
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Akun tidak aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotasi refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Token pair baru
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Akun tidak aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil user saat ini
      responses:
        "200":
          description: Profil user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cabut refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [Users]
      summary: Daftar user (admin)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Daftar user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      summary: Tambah user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                role: { type: string, enum: [admin, petugas, viewer], default: viewer }
      responses:
        "201":
          description: User dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validasi gagal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/{userID}:
    patch:
      tags: [Users]
      summary: Ubah user (admin)
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [admin, petugas, viewer] }
                is_active: { type: boolean }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: User diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Validasi gagal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /devices:
    get:
      tags: [Devices]
      summary: Daftar device
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Daftar device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Devices]
      summary: Tambah device (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  pattern: "^[A-Za-z0-9._-]{3,64}$"
                  description: Opsional. Jika kosong, backend membuat ID unik berformat FFF-XXXXXXXX.
                name: { type: string }
                location_name: { type: string }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                firmware_version: { type: string }
      responses:
        "201":
          description: Device dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: device_id sudah terdaftar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validasi gagal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /devices/{deviceID}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [Devices]
      summary: Detail device
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Devices]
      summary: Ubah device (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                location_name: { type: string }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                firmware_version: { type: string }
      responses:
        "200":
          description: Device diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Validasi gagal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Devices]
      summary: Hapus device (admin)
      responses:
        "204": { description: Device dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{deviceID}/status:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [Devices]
      summary: Status dan telemetri terbaru device
      responses:
        "200":
          description: Status device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{deviceID}/telemetry/latest:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [Telemetry]
      summary: Telemetri terbaru
      responses:
        "200":
          description: Telemetri terbaru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LatestTelemetry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{deviceID}/telemetry/environment:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [Telemetry]
      summary: Riwayat telemetri lingkungan
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Riwayat telemetri lingkungan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EnvironmentTelemetry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{deviceID}/telemetry/fire:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [Telemetry]
      summary: Riwayat telemetri api/asap
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Riwayat telemetri api
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/FireTelemetry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{deviceID}/commands:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [Commands]
      summary: Riwayat command device
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Riwayat command
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Command" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Commands]
      summary: Kirim command pompa (admin/petugas)
      description: |
        Jika `Idempotency-Key` dikirim dan request sebelumnya sudah selesai,
        response `200` mengembalikan command yang sama. Jika request sebelumnya
        masih diproses, response `409`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Kunci unik per user untuk mencegah command ganda (disimpan 24 jam).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, payload]
              properties:
                action:
                  type: string
                  enum: [SET_PUMP]
                payload:
                  type: object
                  required: [state]
                  properties:
                    state: { type: boolean }
                    duration:
                      type: integer
                      minimum: 1
                      maximum: 300
                      default: 30
                      description: Batas atas mengikuti konfigurasi AUTO_PUMP_MAX_DURATION.
      responses:
        "200":
          description: Replay command yang sama untuk Idempotency-Key yang sudah selesai
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Command" }
        "202":
          description: Command diterima
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Command" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Idempotency key sedang diproses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validasi gagal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /commands/{commandID}:
    get:
      tags: [Commands]
      summary: Detail command
      parameters:
        - name: commandID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Command
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Command" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events:
    get:
      tags: [Events]
      summary: Daftar event
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [error, warning, critical] }
        - name: status
          in: query
          schema: { type: string, enum: [active, acknowledged, resolved] }
        - name: event_type
          in: query
          schema:
            type: string
            enum:
              - FIRE_DETECTED
              - SMOKE_DETECTED
              - TEMPERATURE_HIGH
              - SOIL_DRY
              - DEVICE_OFFLINE
              - SENSOR_ERROR
        - name: device_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Daftar event
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: device_id pada filter tidak ditemukan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventID}:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      summary: Detail event
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventID}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      tags: [Events]
      summary: Tandai event ditangani (admin/petugas)
      responses:
        "200":
          description: Event acknowledged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Event tidak aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventID}/resolve:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      tags: [Events]
      summary: Tutup event (admin/petugas)
      responses:
        "200":
          description: Event resolved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Event sudah resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Ringkasan dashboard
      responses:
        "200":
          description: Ringkasan device, risiko, event, dan event terbaru
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /geocode/reverse:
    get:
      tags: [Geocoding]
      summary: Ubah koordinat menjadi nama lokasi
      description: Dipakai mobile dan web dashboard; hasil di-cache oleh backend.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Nama lokasi; label boleh kosong bila tidak ditemukan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/GeocodeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Koordinat tidak valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Penyedia geocoding tidak tersedia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /push/tokens:
    post:
      tags: [Push]
      summary: Daftarkan token FCM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                platform: { type: string, example: android }
      responses:
        "204": { description: Token terdaftar }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /push/tokens/{token}:
    delete:
      tags: [Push]
      summary: Hapus token FCM
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Token dihapus }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /realtime/ticket:
    post:
      tags: [Realtime]
      summary: Buat tiket WebSocket (berlaku 60 detik)
      responses:
        "200":
          description: Tiket WebSocket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ticket: { type: string }
                          expires_in: { type: integer, example: 60 }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DeviceID:
      name: deviceID
      in: path
      required: true
      schema: { type: string }
    EventID:
      name: eventID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token tidak valid atau tidak ada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Role tidak memiliki akses
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Terlalu banyak percobaan
      headers:
        Retry-After:
          description: Detik sampai request berikutnya boleh dicoba
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    DataEnvelope:
      type: object
      properties:
        data: { type: object }

    ListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { type: object }
        meta:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer, format: int64 }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, petugas, viewer] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GeocodeResult:
      type: object
      properties:
        label: { type: string, example: "Jalan Merdeka, Palangka, Palangka Raya" }
        latitude: { type: number, example: -2.2 }
        longitude: { type: number, example: 113.9 }
        provider: { type: string, example: openstreetmap }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string }
        name: { type: string }
        location_name: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        status: { type: string, enum: [online, offline] }
        firmware_version: { type: string }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EnvironmentTelemetry:
      type: object
      properties:
        id: { type: integer, format: int64, readOnly: true }
        device_id: { type: string, format: uuid, description: "ID internal device (UUID), bukan kode device_id" }
        temperature:
          type: number
          nullable: true
          minimum: 0
          maximum: 60
          description: "Opsional; dihilangkan saat sensor DHT11 error."
        humidity:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: "Opsional; dihilangkan saat sensor DHT11 error."
        soil_moisture:
          type: number
          minimum: 0
          maximum: 1023
          description: "Nilai mentah ADC sensor tanah."
        recorded_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }

    FireTelemetry:
      type: object
      properties:
        id: { type: integer, format: int64, readOnly: true }
        device_id: { type: string, format: uuid, description: "ID internal device (UUID), bukan kode device_id" }
        flame_detected: { type: boolean }
        flame_level:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1023
          description: "Nilai mentah ADC sensor api; opsional."
        smoke_level:
          type: integer
          minimum: 0
          maximum: 1023
          description: "Nilai mentah ADC sensor MQ-2."
        pump: { type: boolean }
        buzzer: { type: boolean }
        recorded_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        event_type:
          type: string
          enum:
            - FIRE_DETECTED
            - SMOKE_DETECTED
            - TEMPERATURE_HIGH
            - SOIL_DRY
            - DEVICE_OFFLINE
            - SENSOR_ERROR
        severity: { type: string, enum: [error, warning, critical] }
        source: { type: string }
        message: { type: string }
        status: { type: string, enum: [active, acknowledged, resolved] }
        metadata: { type: object, nullable: true }
        triggered_at: { type: string, format: date-time }
        acknowledged_by: { type: string, format: uuid, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Command:
      type: object
      properties:
        id: { type: string, format: uuid }
        command_id: { type: string }
        device_id: { type: string, format: uuid }
        action: { type: string, enum: [SET_PUMP] }
        payload: { type: object }
        origin: { type: string, enum: [manual, system] }
        status: { type: string, enum: [pending, sent, success, failed, timeout] }
        issued_by: { type: string, format: uuid, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        acked_at: { type: string, format: date-time, nullable: true }
        ack_message: { type: string }
        issued_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LatestTelemetry:
      type: object
      properties:
        device: { $ref: "#/components/schemas/Device" }
        environment: { type: object, allOf: [{ $ref: "#/components/schemas/EnvironmentTelemetry" }], nullable: true }
        fire: { type: object, allOf: [{ $ref: "#/components/schemas/FireTelemetry" }], nullable: true }
        risk_level: { type: string, enum: [NORMAL, WASPADA, BAHAYA, DARURAT, UNKNOWN] }

    DeviceStatus:
      type: object
      properties:
        device: { $ref: "#/components/schemas/Device" }
        status: { type: string }
        last_seen_at: { type: string, format: date-time, nullable: true }
        environment: { type: object, allOf: [{ $ref: "#/components/schemas/EnvironmentTelemetry" }], nullable: true }
        fire: { type: object, allOf: [{ $ref: "#/components/schemas/FireTelemetry" }], nullable: true }
        risk_level: { type: string, enum: [NORMAL, WASPADA, BAHAYA, DARURAT, UNKNOWN] }
        server_time: { type: string, format: date-time }

    DashboardSummary:
      type: object
      properties:
        devices:
          type: object
          properties:
            total: { type: integer }
            online: { type: integer }
            offline: { type: integer }
        risk:
          type: object
          properties:
            counts:
              type: object
              additionalProperties: { type: integer }
        active_events:
          type: object
          properties:
            total: { type: integer }
            by_severity:
              type: object
              additionalProperties: { type: integer }
        recent_events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
